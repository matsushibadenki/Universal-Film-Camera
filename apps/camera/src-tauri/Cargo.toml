[package]
name = "universal-film-camera"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "universal_film_camera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
camera-core.workspace = true
camera-apple.workspace = true
film-core.workspace = true
imaging-core.workspace = true
peer-transfer-core.workspace = true
getrandom.workspace = true
base64.workspace = true
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
mdns-sd = "0.21.0"

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-foundation = { version = "0.3.2", features = ["NSError", "NSString", "NSURL"] }
objc2-photos = { version = "0.3.2", default-features = false, features = ["PHAssetChangeRequest", "PHAssetCreationRequest", "PHChangeRequest", "PHPhotoLibrary", "block2", "dispatch2"] }
